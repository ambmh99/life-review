<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#176B5E">
<title>人生復盤</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root,body[data-theme=classic]{--bg:#F3F5F4;--card:#fff;--ink:#17262B;--mute:#56666B;--line:#DCE3E1;--acc:#176B5E;--on-acc:#fff;--acc-text:#176B5E;--acc2:#0F4D43;--tint:#E2F0EC;--field:#FAFBFB;--track:#E6EBEA;--chip-line:#C9D6D2;--danger:#A12A20;--danger-bg:#FBE4E1;--guide:#F3F8F6;--pri-d:#DDEFEA;--chk:#8A9B98;--pill-bg:#FBE4E1;--pill-ink:#9E2A22;--head:inherit;--warnbg:#FFF1DC;--warn:#7A4A00}
body[data-theme=stars]{--bg:#13163A;--card:#1B1F4B;--ink:#EEF0FF;--mute:#A9ADDB;--line:#2E3370;--acc:#FFD166;--on-acc:#2A2200;--acc-text:#FFD166;--acc2:#FFE29A;--tint:#2A2F66;--field:#22265A;--track:#2E3370;--chip-line:#4A4F86;--danger:#FF9C8F;--danger-bg:#4A2033;--guide:#22265A;--pri-d:#4A3C00;--chk:#8A8FC4;--pill-bg:#22265A;--pill-ink:#EEF0FF;color-scheme:dark}
body[data-theme=mist]{--bg:#F3F4EF;--card:#fff;--ink:#2F3A35;--mute:#66726C;--line:#DDE2DA;--acc:#4A7560;--on-acc:#fff;--acc-text:#4A7560;--acc2:#33543F;--tint:#E5ECE5;--field:#F8F9F6;--track:#E3E8E1;--chip-line:#C9D6CC;--danger:#A12A20;--danger-bg:#F8E3E0;--guide:#F1F5F1;--pri-d:#DCE9DF;--chk:#8A9A90;--pill-bg:transparent;--pill-ink:#4A7560;--head:"Noto Serif TC","Noto Serif CJK TC","Source Han Serif TC",serif}
body[data-theme=moon]{--bg:#17252B;--card:#1F3139;--ink:#E7EFEC;--mute:#9DB3AD;--line:#33494F;--acc:#E9E3C7;--on-acc:#1D2A2F;--acc-text:#E9E3C7;--acc2:#F3EEDA;--tint:#2A3F47;--field:#24383F;--track:#33494F;--chip-line:#4A6168;--danger:#FF9C8F;--danger-bg:#4A2A2E;--guide:#24383F;--pri-d:#3A4448;--chk:#6F8A90;--pill-bg:transparent;--pill-ink:#E9E3C7;--head:"Noto Serif TC","Noto Serif CJK TC","Source Han Serif TC",serif;color-scheme:dark}
body[data-theme=garden]{--bg:#FAF5F2;--card:#fff;--ink:#3A2E33;--mute:#75666C;--line:#EADCCF;--acc:#F2C9D3;--on-acc:#3A2E33;--acc-text:#9A4B63;--acc2:#6E3046;--tint:#FBE9EE;--field:#FDFAF8;--track:#F1E6DE;--chip-line:#E0CFC4;--danger:#A12A20;--danger-bg:#FBE4E1;--guide:#FBF2F4;--pri-d:#5E4A4F;--chk:#B9A3AB;--pill-bg:transparent;--pill-ink:#9A4B63;--head:"Noto Serif TC","Noto Serif CJK TC","Source Han Serif TC",serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 28px) 16px calc(100px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:24px;line-height:1.3;font-family:var(--head)}
h2{margin:0;font-size:16px;font-family:var(--head)}
.sub{margin:0;font-size:14px;color:var(--mute)}
.small{font-size:12px;color:var(--mute)}
.tagline{margin:0;font-size:13px;line-height:1.7;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
body:not([data-theme=classic]) .card{border-radius:22px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.flex1{flex:1}
.btn{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:0 14px;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--acc);color:var(--on-acc);border:0;font-weight:700}
.btn.big{min-height:52px;width:100%;border-radius:14px;font-size:16px}
.btn.link{border:0;background:none;color:var(--acc-text);font-weight:700;padding:0 6px;min-height:40px}
.btn.danger{color:var(--danger);border-color:var(--danger-bg)}
.btn:disabled{opacity:.3;cursor:default}
.pill{display:flex;align-items:center;gap:6px;background:var(--pill-bg);color:var(--pill-ink);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.tier{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:16px}
body:not([data-theme=classic]) .tier{border-radius:24px}
.tier.pri{background:var(--acc);color:var(--on-acc);border-color:var(--acc-text)}
body[data-theme=stars] .tier.pri{box-shadow:0 0 24px rgba(255,209,102,.3)}
.tier .badge{width:48px;height:48px;border-radius:12px;background:var(--tint);color:var(--acc-text);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
body:not([data-theme=classic]) .tier .badge{border-radius:999px}
.tier.pri .badge{background:var(--on-acc);color:var(--acc-text)}
.tier .t{font-size:16px;font-weight:700}
.tier .d{font-size:13px;color:var(--mute)}
.tier.pri .d{color:var(--pri-d)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .wd{text-align:center;font-size:12px;color:var(--mute)}
.day{height:42px;border-radius:8px;background:var(--bg);position:relative;display:flex;align-items:center;justify-content:center;border:0;padding:0;font-size:13px;color:var(--mute)}
body:not([data-theme=classic]) .day{border-radius:12px}
.day.blank{background:none}
.day.fut{background:var(--card);border:1px dashed var(--line)}
.day.today{background:var(--tint);border:2px solid var(--acc-text);color:var(--acc-text);font-weight:700}
.day.sel{outline:2px solid var(--ink);outline-offset:1px}
.day.has .n{position:absolute;top:2px;left:4px;font-size:10px}
.calm{position:absolute;bottom:2px;right:2px;line-height:0}
.cdot{position:absolute;bottom:3px;left:50%;margin-left:-3px;width:6px;height:6px;border-radius:999px}
.day.c svg.xm{margin-right:12px}
.mk{display:flex;align-items:center;justify-content:center;line-height:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--chip-line);background:var(--card);color:var(--ink);font-size:13px;display:inline-flex;align-items:center}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.acc.on{background:var(--acc);color:var(--on-acc);border-color:var(--acc-text)}
label.q{display:flex;gap:10px;align-items:center;font-size:15px;font-weight:700}
.num{width:24px;height:24px;border-radius:999px;background:var(--acc);color:var(--on-acc);font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
textarea,input[type=text],input[type=date],input[type=time]{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;line-height:1.5;background:var(--field);color:var(--ink)}
textarea::placeholder,input::placeholder{color:var(--mute);opacity:.8}
textarea{resize:vertical;min-height:68px}
input:focus,textarea:focus{outline:2px solid var(--acc-text);outline-offset:0;border-color:var(--acc-text)}
input[type=checkbox]{accent-color:var(--acc-text)}
.guide{background:var(--guide);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.glabel{font-size:13px;color:var(--mute)}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px 8px calc(8px + env(safe-area-inset-bottom));z-index:5}
body:not([data-theme=classic]) .tabbar{border-top:0;border-radius:22px 22px 0 0;box-shadow:0 -2px 12px rgba(0,0,0,.06)}
.tabbar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;font-size:12px;color:var(--mute)}
.tabbar button.on{color:var(--acc-text);font-weight:700}
.rech{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 12px 12px;z-index:4;display:flex;flex-direction:column;gap:10px}
.bar{height:6px;border-radius:999px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc-text);border-radius:999px;transition:width .9s linear}
.bar.warn i{background:#D98A1E}
.banner{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--warnbg);color:var(--warn);border-radius:10px;padding:8px 8px 8px 12px;font-size:13px;font-weight:500}
.banner .btn{background:#fff;color:#2B2B2B;border-color:#E8D9C0}
.banner.red{background:var(--danger-bg);color:var(--danger)}
.banner.red .btn{background:var(--card);color:var(--ink);border-color:var(--line)}
.banner.red .btn.pri{background:var(--acc);color:var(--on-acc)}
.hidden{display:none!important}
.recfoot{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;text-align:center}
.recfoot>*{max-width:520px;width:100%;margin:0 auto}
.tm{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.tm.warn{color:#D98A1E!important}
.stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:22px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--track);border-radius:12px;padding:4px}
.seg button{min-height:40px;border:0;border-radius:9px;background:transparent;color:var(--mute);font-size:14px}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700}
.card.act{flex-direction:row;align-items:flex-start;gap:12px}
.chk{width:44px;height:44px;margin:-10px -8px -10px -10px;border:0;background:none;display:flex;align-items:center;justify-content:center;flex:none}
.chk span{width:24px;height:24px;border-radius:999px;border:2px solid var(--chk);display:flex;align-items:center;justify-content:center}
.chk.done span{background:var(--acc);border-color:var(--acc-text)}
.due{font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--tint);color:var(--acc2)}
.due.soon{background:var(--warnbg);color:var(--warn)}
.due.late{background:var(--danger-bg);color:var(--danger)}
.tagbar{display:grid;grid-template-columns:76px minmax(0,1fr) 28px;align-items:center;gap:10px;width:100%;min-height:44px;padding:4px 8px;border-radius:10px;border:1px solid transparent;background:none;color:var(--ink);text-align:left;font-size:14px}
.tagbar.on{background:var(--tint);border-color:var(--chip-line);font-weight:700}
.tagbar .track{height:12px;border-radius:999px;background:var(--track);overflow:hidden}
.tagbar .track i{display:block;height:100%;background:var(--chk);border-radius:999px}
.tagbar.on .track i{background:var(--acc-text)}
.tagbar .c{text-align:right;font-weight:700}
.entry{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.6}
.entry.first{border-top:0;padding-top:0}
.ef b{font-size:12px;color:var(--mute);font-weight:500;display:block}
.tchip{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--tint);color:var(--acc-text)}
.lock{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px}
.dots{display:flex;gap:16px}
.dots i{width:14px;height:14px;border-radius:999px;border:2px solid var(--acc-text)}
.dots i.f{background:var(--acc-text)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.pad button{height:72px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:24px}
.pad button.plain{border:0;background:none;font-size:15px;color:var(--mute)}
.err{color:var(--danger);font-size:14px;min-height:20px;margin:0}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:90vw;text-align:center}
.range{width:100%;height:44px;accent-color:var(--acc-text);margin:0;cursor:pointer}
.empty{text-align:center;color:var(--mute);font-size:14px;margin:0;padding:8px}
.themes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.th{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);text-align:left}
.th.on{border-color:var(--acc-text)}
.th .sw{display:flex;align-items:center;gap:6px;width:100%;height:44px;border-radius:10px;padding:0 10px}
.th .sw i{width:18px;height:18px;border-radius:999px;display:block}
.th b{font-size:14px}
/* 晨霧呼吸 */
.breath{position:relative;width:210px;height:210px;border:0;background:none;padding:0;border-radius:999px}
.breath i{position:absolute;border-radius:999px;transform:scale(.9)}
.breath i:nth-child(1){inset:0;background:#E5ECE5}
.breath i:nth-child(2){inset:27px;background:#D3E2D6}
.breath i:nth-child(3){inset:54px;background:#BDD4C3}
.breath.go i{animation:breathe 8s ease-in-out 3}
.breath.go i:nth-child(2){animation-delay:.15s}
.breath.go i:nth-child(3){animation-delay:.3s}
@keyframes breathe{0%,100%{transform:scale(.82)}50%{transform:scale(1.04)}}
.breath .bt{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;height:100%;justify-content:center}
.breath .bt b{font-family:var(--head);font-size:22px;color:#2F4A3C}
.breath .bt small{font-size:12px;color:#3F5A4B}
/* 月光湖 */
.moonart{position:relative;width:240px;height:196px}
.moonart .m{position:absolute;top:8px;left:45px;width:150px;height:150px;border-radius:999px;background:#E9E3C7;box-shadow:0 0 60px 10px rgba(233,227,199,.22)}
.moonart .c1{position:absolute;top:42px;left:96px;width:22px;height:22px;border-radius:999px;background:#DCD4B2}
.moonart .c2{position:absolute;top:90px;left:132px;width:14px;height:14px;border-radius:999px;background:#DCD4B2}
.moonart .lake{position:absolute;bottom:0;left:0;right:0;height:46px;border-radius:999px 999px 0 0;background:#1F3139}
.moonart .r1{position:absolute;bottom:22px;left:62px;width:116px;height:3px;border-radius:999px;background:rgba(233,227,199,.45)}
.moonart .r2{position:absolute;bottom:12px;left:86px;width:68px;height:3px;border-radius:999px;background:rgba(233,227,199,.3)}
/* 心之花園 */
.gweek{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));align-items:end;height:128px;margin-top:4px}
.gweek>div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.soil{height:12px;background:#EADCCF;margin:0 -16px}
.gwd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:6px 0 12px;background:#EADCCF;margin:0 -16px -16px;border-radius:0 0 22px 22px}
.gwd span{text-align:center;font-size:11px;color:#5E4A4F}
@media (prefers-reduced-motion:reduce){.breath.go i{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<script src="xlsx.mini.min.js" defer></script>
<script>
'use strict';
const KEY='fupan-v1';
const TIERS={
  std:{name:'標準版',color:'#C8372D',desc:'完整複盤'},
  min:{name:'輕量版',color:'#E0766B',desc:'記下今天的關鍵事件'},
  res:{name:'救命備案',color:'#F2B8B1',desc:'累爆了？寫一句話就好'}
};
const RANK={std:3,min:2,res:1};
const WD='日一二三四五六';

/* ---------- 資料 ---------- */
function fill(s){
  s=s||{};
  const out=Object.assign({v:1,entries:[],actions:[],reviews:{},lastExport:null},s,{
    settings:Object.assign({tags:['工作','情緒','人際','健康','時間管理'],pinHash:null},s.settings||{})
  });
  const st=out.settings;
  if(!st.timers)st.timers={std:st.timerMin||5,min:2};
  delete st.timerMin;
  return out;
}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===1)return fill(s);}catch(e){}return fill({});}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('儲存失敗，手機空間可能不足');}}

/* ---------- 小工具 ---------- */
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ds(new Date());
const parse=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ds(d);};
const fmtMD=s=>{const d=parse(s);return (d.getMonth()+1)+'/'+d.getDate();};
const weekStart=s=>{const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ds(d);};
const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+pad(s%60);};
const durTxt=sec=>{const s=Math.round(sec||0);if(s<60)return s+' 秒';return Math.floor(s/60)+' 分'+(s%60?' '+(s%60)+' 秒':'');};
function toast(msg){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}

const ICON={
  today:'<path d="M4 20h4L19 9l-4-4L4 16v4z"/>',
  actions:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/>',
  review:'<path d="M5 20V10M12 20V4M19 20v-7"/>',
  settings:'<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>',
  back:'<path d="M15 6l-6 6 6 6"/>',
  fwd:'<path d="M9 6l6 6-6 6"/>',
  clock:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/>',
  bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9V16h7v-2.1A6 6 0 0 0 12 3z"/>',
  dl:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
  check:'<path d="M5 12l5 5 9-10"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'
};
const ic=(n,s,c,w)=>`<svg aria-hidden="true" width="${s||24}" height="${s||24}" viewBox="0 0 24 24" fill="none" style="stroke:${c||'currentColor'}" stroke-width="${w||2}" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;

function tick(){

  const el=(Date.now()-r.start)/1000,lim=r.limit+r.extra,rem=Math.max(0,lim-el);

/* ---------- 密碼鎖 ---------- */
async function hashPin(p){
  const txt='fupan:'+p;
  if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}
  let h=0;for(const c of txt)h=(h*31+c.charCodeAt(0))|0;return 'f'+h;
}
function lockHTML(){
  const p=U.pin;
  const title={unlock:'輸入密碼',set1:'設定 4 位數密碼',set2:'再輸入一次確認',off:'輸入目前的密碼',change:'輸入目前的密碼'}[p.mode];
  const k=['1','2','3','4','5','6','7','8','9'];
  return `<div class="lock" role="dialog" aria-modal="true" aria-label="${title}">${ic('lock',32,'var(--acc-text)')}<h1 style="font-size:20px">${title}</h1><div class="dots" aria-label="已輸入 ${p.buf.length} 位">${[0,1,2,3].map(i=>`<i class="${i<p.buf.length?'f':''}"></i>`).join('')}</div><p class="err" role="alert">${esc(p.err||'')}</p><div class="pad">${k.map(n=>`<button data-act="pk" data-k="${n}">${n}</button>`).join('')}${p.mode==='unlock'?'<button class="plain" data-act="forgot">忘記密碼</button>':'<button class="plain" data-act="pin-cancel">取消</button>'}<button data-act="pk" data-k="0">0</button><button class="plain" data-act="pk" data-k="del" aria-label="刪除一位">⌫</button></div></div>`;
}
let pinBusy=false,pinQueue=[];
async function pk(k){
  if(pinBusy){pinQueue.push(k);return;}
  await pkOne(k);
  while(pinQueue.length&&!pinBusy)await pkOne(pinQueue.shift());
}
async function pkOne(k){
  const p=U.pin;if(!p)return;
  if(k==='del'){p.buf=p.buf.slice(0,-1);render();return;}
  if(p.buf.length>=4)return;
  p.buf+=k;p.err='';render();
  if(p.buf.length<4)return;
  pinBusy=true;
  const b=p.buf;p.buf='';
  if(p.mode==='set1'){p.first=b;p.mode='set2';}
  else if(p.mode==='set2'){
    if(b===p.first){S.settings.pinHash=await hashPin(b);save();U.pin=null;toast('密碼鎖已開啟');}
    else{p.mode='set1';p.first='';p.err='兩次不一樣，請重新設定';}
  }else{
    const ok=(await hashPin(b))===S.settings.pinHash;
    if(!ok)p.err='密碼錯誤';
    else if(p.mode==='unlock')U.pin=null;
    else if(p.mode==='off'){S.settings.pinHash=null;save();U.pin=null;toast('已關閉密碼鎖');}
    else if(p.mode==='change'){p.mode='set1';}
  }
  pinBusy=false;render();
}

/* ---------- Excel ---------- */
function widen(ws,w){ws['!cols']=w.map(x=>({wch:x}));}
function exportXlsx(){
  if(!window.XLSX)return toast('匯出元件還沒載入，請稍後再試');
  const X=XLSX.utils,wb=X.book_new();
  const E=S.entries.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.created-b.created).map(e=>{const tr=e.tree||{},o=e.orid||{};return {
    '日期':e.date,'星期':'週'+WD[parse(e.date).getDay()],'方式':TIERS[e.tier].name,'用時(分)':+((e.dur||0)/60).toFixed(1),'標籤':(e.tags||[]).join('、'),
    '最值得記住的一件事':e.one||'','關鍵事件':(e.events||[]).map((x,i)=>(i+1)+'. '+x.e).join('\n'),
    '靜心':e.calm?'✓':'','今天感謝的人事物':e.thanks||'','今天最值得記念的故事/一句話':e.best||'','沒做好':e.bad||'','5Why':(e.why||[]).map((w,i)=>(i+1)+'. '+w).join('\n'),'能控制的部分':e.ctrl||'',
    '樹葉':tr.leaf||'','樹幹':tr.trunk||'','樹根':tr.root||'','情緒淬鍊 事實':o.o||'','情緒淬鍊 感受':o.r||'','情緒淬鍊 意義':o.i||'','情緒淬鍊 決定':o.d||'','明天一定要做':e.next||''};});
  const s1=X.json_to_sheet(E.length?E:[{'日期':'（還沒有紀錄）'}]);widen(s1,[11,6,9,8,14,30,30,6,30,30,30,30,24,24,24,24,24,24,24,24,30]);X.book_append_sheet(wb,s1,'每日紀錄');
  const A=S.actions.slice().sort((a,b)=>(a.due||'')<(b.due||'')?-1:1).map(a=>({'行動':a.title,'期限':a.due||'','來源':a.src||'','狀態':a.done?'已完成':'進行中','完成日期':a.doneAt?ds(new Date(a.doneAt)):''}));
  const s2=X.json_to_sheet(A.length?A:[{'行動':'（還沒有行動）'}]);widen(s2,[36,11,18,8,11]);X.book_append_sheet(wb,s2,'行動清單');
  const R=Object.keys(S.reviews).sort().map(k=>{const r=S.reviews[k];return {'週':fmtMD(k)+' – '+fmtMD(addDays(k,6)),'重複出現的狀況':r.q1,'沒完成卡在哪':r.q2,'值得保留的做法':r.q3,'下週新做法':r.q4};});
  const s3=X.json_to_sheet(R.length?R:[{'週':'（還沒有週回顧）'}]);widen(s3,[14,30,30,30,30]);X.book_append_sheet(wb,s3,'週回顧');
  const js=JSON.stringify(Object.assign({},S,{settings:Object.assign({},S.settings,{pinHash:null})})),rows=[['人生復盤備份 v1（匯回用，請勿修改這個工作表）']];
  for(let i=0;i<js.length;i+=30000)rows.push([js.slice(i,i+30000)]);
  X.book_append_sheet(wb,X.aoa_to_sheet(rows),'_備份資料');
  const fn='人生復盤_'+today().replace(/-/g,'')+'.xlsx';
  XLSX.writeFile(wb,fn);
  S.lastExport=Date.now();save();render();toast('已匯出：'+fn);
}
async function importXlsx(file){
  if(!window.XLSX)return toast('匯入元件還沒載入，請稍後再試');
  try{
    const wb=XLSX.read(await file.arrayBuffer());
    const sh=wb.Sheets['_備份資料'];if(!sh)return toast('這個檔案不是復盤 App 匯出的備份');
    const rows=XLSX.utils.sheet_to_json(sh,{header:1,raw:true});
    const data=JSON.parse(rows.slice(1).map(r=>r[0]||'').join(''));
    if(data.v!==1||!Array.isArray(data.entries))throw new Error('bad');
    if(!confirm(`備份裡有 ${data.entries.length} 則紀錄、${(data.actions||[]).length} 個行動。\n匯回後會取代手機裡現在的資料，確定嗎？`))return;
    const pin=S.settings.pinHash;S=fill(data);S.settings.pinHash=pin;save();U.rvd={};render();toast('匯回完成');
  }catch(e){toast('讀取失敗，檔案可能損壞或不是備份檔');}
}

/* ---------- 畫面 ---------- */
const app=document.getElementById('app');
function tabbar(){
  return `<nav class="tabbar" aria-label="主要分頁">${[['today','今天'],['actions','行動'],['review','回顧'],['settings','設定']].map(a=>`<button class="${U.view===a[0]?'on':''}" ${U.view===a[0]?'aria-current="page"':''} data-act="view" data-v="${a[0]}">${ic(a[0],24)}${a[1]}</button>`).join('')}</nav>`;
}
function render(){
  const tk=thk();if(document.body.dataset.theme!==tk){document.body.dataset.theme=tk;const mt=document.querySelector('meta[name=theme-color]');if(mt)mt.content=THEMES[tk].meta;}
  let h;
  if(U.pin&&U.pin.mode==='unlock')h='';
  else if(U.rec)h=vRec();
  else h=`<main class="wrap">${({today:vToday,actions:vActions,review:vReview,settings:vSettings})[U.view]()}</main>`+tabbar();
  if(U.pin)h+=lockHTML();
  app.innerHTML=h;
  if(U.rec&&!U.pin)tick();
}
const find=id=>S.actions.find(a=>a.id===id);
function act(a,d){
  const t=today();let x;
  switch(a){
    case 'view':U.view=d.v;U.tag=null;U.showAll=false;if(d.v==='review')U.week=weekStart(t);if(d.v==='today')U.month=t.slice(0,7);render();window.scrollTo(0,0);break;
    case 'rec':startRec(d.tier);break;
    case 'rec-cancel':if(hasContent()&&!confirm('還沒存，確定要離開嗎？'))return;stopRec();render();break;
    case 'rec-save':saveRec();break;
    case 'rec-more':U.rec.extra+=120;U.rec.buzz=false;tick();break;
    case 'guide':U.rec.g=U.rec.g===d.g?null:d.g;render();break;
    case 'why-more':U.rec.whyN=Math.min(5,U.rec.whyN+1);render();{const el=document.getElementById('w'+(U.rec.whyN-1));if(el)el.focus();}break;
    case 'ev-more':U.rec.events.push({t:'',e:''});render();break;
    case 'tag':{const i=U.rec.tags.indexOf(d.t);if(i<0)U.rec.tags.push(d.t);else U.rec.tags.splice(i,1);render();break;}
    case 'tag-new':{const n=(prompt('新增標籤名稱（10 個字以內）')||'').trim().slice(0,10);if(!n)return;if(!S.settings.tags.includes(n)){S.settings.tags.push(n);save();}if(!U.rec.tags.includes(n))U.rec.tags.push(n);render();break;}
    case 'day':U.day=U.day===d.d?null:d.d;render();break;
    case 'mon':{const p=U.month.split('-').map(Number),dt=new Date(p[0],p[1]-1+Number(d.n),1);U.month=dt.getFullYear()+'-'+pad(dt.getMonth()+1);U.day=null;render();break;}
    case 'act-done':if((x=find(d.id))){x.done=true;x.doneAt=Date.now();save();toast('做到了！');}render();break;
    case 'act-toggle':if((x=find(d.id))){x.done=!x.done;x.doneAt=x.done?Date.now():null;save();if(x.done)toast('做到了！');}render();break;
    case 'act-later':if((x=find(d.id))){x.due=addDays(t,1);save();toast('延到明天了');}render();break;
    case 'act-del':if(confirm('刪除這個行動？')){S.actions=S.actions.filter(y=>y.id!==d.id);save();render();}break;
    case 'act-add':{const ti=U.newAct.trim();if(!ti)return toast('先寫下要做什麼');S.actions.push({id:uid(),title:ti,due:U.newDue||addDays(t,1),src:'手動新增',created:Date.now(),done:false,doneAt:null});U.newAct='';U.newDue='';U.actTab='open';save();render();toast('已加入');break;}
    case 'acttab':U.actTab=d.v;render();break;
    case 'wk':U.week=addDays(U.week,Number(d.n));U.tag=null;U.showAll=false;render();break;
    case 'tagsel':U.tag=U.tag===d.t?null:d.t;render();break;
    case 'allw':U.showAll=!U.showAll;render();break;
    case 'rv-save':saveReview();break;
    case 'export':exportXlsx();break;
    case 'ttab':U.timerTab=d.v;render();break;
    case 'theme':S.settings.theme=d.v;save();render();toast('已換成「'+THEMES[d.v].name+'」');break;
    case 'breathe':breathe();break;
    case 'tag-del':if(confirm(`刪除標籤「${d.t}」？舊紀錄上的標籤會保留。`)){S.settings.tags=S.settings.tags.filter(y=>y!==d.t);save();render();}break;
    case 'tag-add':{const n=U.newTag.trim().slice(0,10);if(!n)return;if(!S.settings.tags.includes(n))S.settings.tags.push(n);U.newTag='';save();render();break;}
    case 'pin-on':U.pin={mode:'set1',buf:'',first:'',err:''};render();break;
    case 'pin-off':U.pin={mode:'off',buf:'',err:''};render();break;
    case 'pin-change':U.pin={mode:'change',buf:'',first:'',err:''};render();break;
    case 'pin-cancel':U.pin=null;render();break;
    case 'pk':pk(d.k);break;
    case 'forgot':
      if(confirm('密碼無法找回。唯一的辦法是清除這支手機裡的所有復盤資料，之後可以用匯出過的 Excel 匯回。要清除嗎？')&&confirm('真的確定嗎？沒匯出過的紀錄會永久消失。')){
        localStorage.removeItem(KEY);S=fill({});U.pin=null;U.rvd={};render();toast('已清除，可以重新開始');
      }break;
    case 'del-entry':if(confirm('刪除這則紀錄？')){S.entries=S.entries.filter(e=>e.id!==d.id);save();render();}break;
    case 'wipe':if(confirm('確定刪除所有紀錄、行動和週回顧？')&&confirm('真的確定嗎？刪除後無法復原。')){S=fill({settings:S.settings,lastExport:S.lastExport});save();U.rvd={};U.day=null;render();toast('已刪除');}break;
  }
}
app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;act(b.dataset.act,b.dataset);});
app.addEventListener('input',e=>{
  const t=e.target,ds_=t.dataset,r=U.rec;
  if(r){
    if(ds_.f!=null)r.f[ds_.f]=t.value;
    if(ds_.why!=null)r.why[+ds_.why]=t.value;
    if(ds_.tree!=null)r.tree[ds_.tree]=t.value;
    if(ds_.orid!=null)r.orid[ds_.orid]=t.value;
    if(ds_.ev!=null)r.events[+ds_.ev][ds_.k]=t.value;
    if(t.id==='due')r.due=t.value;
  }
  if(ds_.rv!=null&&U.rvd[U.week])U.rvd[U.week][ds_.rv]=t.value;
  if(t.id==='newAct')U.newAct=t.value;
  if(t.id==='newDue')U.newDue=t.value;
  if(t.id==='newTag')U.newTag=t.value;
  if(t.id==='trange'){const v=Number(t.value);S.settings.timers[U.timerTab||'std']=v;document.getElementById('tval').textContent=v;const b=document.querySelector('[data-act=ttab].on');if(b)b.textContent=TIERS[U.timerTab||'std'].name+' · '+v+' 分';}
});
app.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='addAct'&&U.rec)U.rec.add=t.checked;
  if(t.id==='calm'&&U.rec)U.rec.calm=t.checked;
  if(t.id==='due'&&U.rec)U.rec.due=t.value;
  if(t.id==='newDue')U.newDue=t.value;
  if(t.id==='trange'){save();toast(TIERS[U.timerTab||'std'].name+'改為 '+t.value+' 分鐘');}
  if(t.id==='imp'&&t.files&&t.files[0]){importXlsx(t.files[0]);t.value='';}
});
document.addEventListener('keydown',e=>{if(!U.pin)return;if(/^[0-9]$/.test(e.key))pk(e.key);else if(e.key==='Backspace')pk('del');});
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now();return;}
  if(S.settings.pinHash&&!U.pin&&hiddenAt&&Date.now()-hiddenAt>60000){U.pin={mode:'unlock',buf:'',err:''};}
  render();
});

if(S.settings.pinHash)U.pin={mode:'unlock',buf:'',err:''};
render();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
